# WisprWave (optional): keep microphone sources warm after use.
#
# WirePlumber suspends idle ALSA sources after 5s; on some hardware (notably
# USB mics, where kernel autosuspend then powers the device down) the next
# capture start loses up to ~1s of audio while the mic wakes. WisprWave's
# start cue only plays once audio actually flows, so no words are ever lost —
# this drop-in just makes the cue arrive fast during active dictation
# sessions by letting the mic nap only after 5 minutes of idle.
#
# Installed to ~/.config/wireplumber/wireplumber.conf.d/ by
# `install.sh --keep-mic-awake`; removed by uninstall.sh.
# Set 0 to never suspend; the default without this file is 5 (seconds).

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 300
      }
    }
  }
]
